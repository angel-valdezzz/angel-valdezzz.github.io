name: Gallery demo checks
on:
  push:
    branches: [codex/portfolio-gallery-demo]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: gallery-demo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:sites
      - run: node scripts/package-gallery-demo.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:gallery
      - name: Expose review captures
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          function walk(dir){return fs.existsSync(dir)?fs.readdirSync(dir,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(path.join(dir,e.name)):[path.join(dir,e.name)]):[];}
          for(const file of walk('test-results').filter(f=>/(gallery-preview|motion-preview|motion-later|motion-detail|navigation-top|navigation-about|navigation-contact)\.jpg$/.test(f))){
            const name=(file.includes('mobile')?'mobile':'desktop')+'-'+path.basename(file,'.jpg');
            const data=fs.readFileSync(file).toString('base64');
            for(let i=0;i<data.length;i+=16000) console.log('GALLERY_IMAGE '+name+' '+(i/16000)+' '+data.slice(i,i+16000));
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-browser-review
          path: |
            test-results
            gallery-test-report
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: angel-gallery-demo
          path: dist/client/angel-gallery-demo.html
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: gallery-static-build
          path: dist/client
          retention-days: 14
